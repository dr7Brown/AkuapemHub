<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AkuapemConnect</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#ffffff; }
  .loading-wrap {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .loading-wrap img { width:96px; height:96px; margin-bottom:16px; }
  .loading-wrap p { color:#6b7280; font-size:14px; }
  .spinner {
    width:28px; height:28px; border:3px solid #e5e7eb; border-top-color:#2f8f5b;
    border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <!--
    This screen is only ever seen for a split second (or if the device has no
    network at all) — Capacitor's `server.url` config (see capacitor.config.json)
    makes the app load the live AkuapemConnect site directly on startup instead
    of this bundled page. This file exists only because Capacitor requires a
    local `webDir` to exist even when it isn't the primary content source.
  -->
  <div class="loading-wrap">
    <div class="spinner"></div>
    <p>Loading AkuapemConnect…</p>
  </div>
</body>
</html>
