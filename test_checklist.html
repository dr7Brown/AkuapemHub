var STATE_KEY = 'akc_checklist_v1';
function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveState(s) {
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
}

// ── Actions ───────────────────────────────────────────────────────────────────
function setStatus(sel, key, si) {
  var val = sel.value;
  sel.className = 'status-select ' + val;
  var tr = document.getElementById('row-' + key);
  if (val === 'pass') tr.classList.add('done');
  else tr.classList.remove('done');
  var rowData = state[key] || {};
  rowData.status = val;
  state[key] = rowData;
  saveState(state);
  updateStats();
  updateSectionProgress(si);
}

function setField(inp, key, field) {
  var rowData = state[key] || {};
  rowData[field] = inp.value;
  state[key] = rowData;
  saveState(state);
}

function updateSectionProgress(si) {
  var sec = sections[si];
  var pass = 0, done = 0;
  sec.items.forEach(function(_, ii) {
    var key = 'r_' + si + '_' + ii;
    var s = (state[key] || {}).status || 'pending';
    if (s !== 'pending') done++;
    if (s === 'pass') pass++;
  });
  var el = document.getElementById('sp-' + si);
  if (el) el.textContent = pass + '/' + sec.items.length + ' passed';
}

function updateStats() {
  var pass=0, fail=0, done=0;
  sections.forEach(function(sec, si) {
    sec.items.forEach(function(_, ii) {
      var s = (state['r_'+si+'_'+ii] || {}).status || 'pending';
      if (s==='pass') { pass++; done++; }
      else if (s==='fail') { fail++; done++; }
      else if (s==='skip') done++;
    });
  });
  document.getElementById('stat-total').textContent = totalItems;
  document.getElementById('stat-pass').textContent  = pass;
  document.getElementById('stat-fail').textContent  = fail;
  document.getElementById('stat-pct').textContent   = totalItems ? Math.round(done/totalItems*100)+'%' : '0%';
  document.getElementById('progress-bar').style.width = (totalItems ? (done/totalItems*100) : 0) + '%';
}

function resetAll() {
  if (!confirm('Reset all test results? This cannot be undone.')) return;
  localStorage.removeItem(STATE_KEY);
  location.reload();
}
</script>
</body>
</html>
